version: 2
updates:
  # Each template pins ghul.compiler in .config/dotnet-tools.json, which
  # Dependabot reads directly, and ghul.runtime through Directory.Build.props
  # plus Directory.Packages.props, which it only reads while evaluating a
  # project file. It does not recognise .ghulproj, so each of these
  # directories holds a stand-in .dependabot/*.csproj for that evaluation.
  - package-ecosystem: "nuget"
    directories:
      - "/templates/ghul-console"
      - "/templates/ghul-console/.dependabot"
      - "/templates/ghul-classlib"
      - "/templates/ghul-classlib/.dependabot"
      - "/tests/ghul-classlib"
      - "/tests/ghul-classlib/.dependabot"
    schedule:
      interval: "daily"
