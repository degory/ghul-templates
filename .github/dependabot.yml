version: 2
updates:
  # Wrapper csproj imports ghul-console.ghulproj so Dependabot can resolve
  # PackageVersion entries via MSBuild (it does not recognise .ghulproj).
  - package-ecosystem: "nuget"
    directory: "/.dependabot/"
    schedule:
      interval: "daily"

  # .config/dotnet-tools.json + Directory.Packages.props in each template
  # and the classlib tests, so the pinned ghul.compiler and ghul.runtime
  # versions get bumped as new releases ship.
  - package-ecosystem: "nuget"
    directories:
      - "/templates/ghul-console"
      - "/templates/ghul-classlib"
      - "/tests/ghul-classlib"
    schedule:
      interval: "daily"
